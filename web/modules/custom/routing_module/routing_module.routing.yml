routing_module.custom_page:
  path: '/custom-access'
  defaults:
    _controller: '\Drupal\routing_module\Controller\WelcomeController::content'
    _title: 'Example Access Page'
  requirements:
    _custom_access: 'routing_module.access_check::access'

routing_module.page:
  path: '/example-access'
  defaults:
    _controller: '\Drupal\routing_module\Controller\WelcomeController::content'
    _title: 'Custom Page'
  requirements:
    _role: 'administrator+editor'

routing_module.parameter:
  path: '/parameter/{id}'
  defaults:
    _controller: '\Drupal\routing_module\Controller\CustomParameter::showId'
    _title: 'Custom Parameter'
  requirements:
    _role: 'administrator+editor'
    id: \d+   

routing_module.static_permission:
  path: '/static-permission'
  defaults:
    _controller: '\Drupal\routing_module\Controller\WelcomeController::content'
    _title: 'Custom Page'
  requirements:
    _permission: 'access example page'
